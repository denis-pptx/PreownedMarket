services:
  identity.db:
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
    ports:
      - 5433:5432
    volumes:
      - identity.db-data:/var/lib/postgresql/data
    networks:
      - my-network
  
  elasticsearch:
    environment:
      - xpack.security.enabled=false
      - discovery.type=single-node
    ports:
      - 9200:9200
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - my-network
  
  kibana:
    ports:
      - 5601:5601
    environment:
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    networks:
      - my-network
 
  item.db:
    environment:
      POSTGRES_DB: item_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpassword
    ports:
      - 5434:5432
    volumes:
      - item.db-data:/var/lib/postgresql/data
    networks:
      - my-network

  chat.db:
    ports:
      - 27018:27017
    volumes:
      - chat.db-data:/data/db
    networks:
      - my-network
  
  market.mq:
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - market.mq-data:/var/lib/rabbitmq
    networks:
      - my-network
  
  redis:
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    networks:
      - my-network

volumes:
  identity.db-data:
  item.db-data:
  chat.db-data:
  redis-data:
  market.mq-data:
  elasticsearch-data:

networks:
  my-network:  